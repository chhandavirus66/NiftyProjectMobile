name: Build Flet APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet yfinance pandas requests numpy

      - name: Build APK
        run: |
          yes | flet build apk main.py

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nifty-app-apk
          path: build/apk/*.apk
          
